name: Daily dependency security audit
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Audit locked production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Explain audit scope
        if: always()
        run: |
          echo '### Daily dependency security audit' >> "$GITHUB_STEP_SUMMARY"
          echo 'Checks high/critical advisories in production npm dependencies.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Does not modify packages, merge PRs, deploy, or change billing.' >> "$GITHUB_STEP_SUMMARY"
